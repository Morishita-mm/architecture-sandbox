services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8080:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-gemini-2.5-flash}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://generativelanguage.googleapis.com}
      FRONTEND_ORIGIN: http://localhost:5173
      PORT: "8080"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_APP_SHARE_URL: http://localhost:5173

name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
      - run: cargo fmt --all -- --check
        working-directory: backend
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: backend
      - run: cargo test --locked && cargo build --locked
        working-directory: backend
      - run: node --test scripts/backend.test.mjs
      - run: docker build --platform linux/amd64 -f Dockerfile.prod -t architecture-sandbox:test .
      - run: node scripts/container-smoke.mjs architecture-sandbox:test

  frontend-test:
    name: Frontend Lint & Cloudflare Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://cloud-run-fixture.example.com
          VITE_APP_SHARE_URL: https://sandbox.morimizu.dev
      - run: npm run deploy:check
        working-directory: frontend
        env:
          WRANGLER_SEND_METRICS: 'false'

  infrastructure-test:
    name: Terraform Validate & Plan Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive terraform/gcp
      - run: terraform -chdir=terraform/gcp init -backend=false -lockfile=readonly
      - run: terraform -chdir=terraform/gcp validate
      - run: terraform -chdir=terraform/gcp test
      - run: bash -n deploy_b.sh deploy_f.sh

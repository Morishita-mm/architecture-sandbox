# ==============================================================================
# Architecture Sandbox - Next Development Steps
# ==============================================================================
# This file outlines the roadmap for future features and improvements.
# ==============================================================================

# ------------------------------------------------------------------------------
# ✅ Completed Features (完了済み)
# ------------------------------------------------------------------------------
completed_features:
  - feature: "グループ化ノード (Sub Flows) の実装"
    status: "Done"
    details: "VPC/AZ等の枠に対し、子ノードの吸着・追従・はみ出し防止・親の自動拡大を実装済み。"

# ------------------------------------------------------------------------------
# 🚀 Phase 1: Immediate Next Steps (表現力と使い勝手の向上)
# ------------------------------------------------------------------------------
phase_1_immediate:
  - feature: "接続線 (Edge) の表現力強化"
    priority: "Highest"
    description: "コンポーネント間の通信プロトコルや性質を視覚化する。"
    details:
      - ラベル機能: `HTTPS`, `SQL`, `gRPC` などのテキストを線上に表示。
      - 線種の変更: 実線 (同期通信), 点線 (非同期/メッセージング) の切り替え。
      - プロパティパネル対応: エッジ選択時もノード同様に設定画面を表示する。

  - feature: "設計図の画像エクスポート"
    priority: "High"
    description: "現在のキャンバスの状態を画像ファイル (PNG/JPG) としてダウンロードする機能。"
    tech_stack: "html-to-image"
    use_case: "SNSシェア時に、スコアだけでなく実際の構成図も添付できるようにする。"

# ------------------------------------------------------------------------------
# 📦 Phase 2: Content & Onboarding (コンテンツ拡充)
# ------------------------------------------------------------------------------
phase_2_content:
  - feature: "プリセット構成 (テンプレート) の配置"
    priority: "Medium"
    description: "よくある構成パターンをワンクリックで一括配置する機能。"
    examples:
      - "Web 3層構成 (ALB + EC2 + RDS)"
      - "サーバーレス構成 (API Gateway + Lambda + DynamoDB)"
    target_user: "ゼロから配置するのが難しい初学者"

# ------------------------------------------------------------------------------
# 🏗️ Infrastructure & Operations (将来的な検討事項)
# ------------------------------------------------------------------------------

    status: "Implemented for Cloudflare/GCP migration"
    reason: "PR CIとmainの承認付きCloud Run/Cloudflare CDを実装し、本番公開済み。最新の受入状況はdocs/current_phase.yaml参照。"
  
  - topic: "User Authentication"
    status: "Pending"
    solution: "未選定。今回のstateless移植の範囲外。"

  - topic: "Server-side Persistence"

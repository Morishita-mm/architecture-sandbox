project_summary:
  name: architecture-sandbox
  status: Cloudflare/GCP production published; current main release status is in GitHub Actions
  persistence: Local JSON files only; no database
urls:
  frontend: https://sandbox.morimizu.dev
  backend: https://architecture-sandbox-api-h5zlhkux4q-an.a.run.app
architecture:
  frontend: Cloudflare Workers Static Assets (React / Vite SPA)
  backend: GCP Cloud Run (Rust / Axum, asia-northeast1)
  images: Artifact Registry (linux/amd64, immutable digest)
  secrets: Secret Manager (pinned numeric version, dedicated runtime identity)
  ai: Gemini Developer API (gemini-3.5-flash-lite, configurable)
  scaling:
    min_instances: 0
    max_instances: 2
    concurrency: 8
    memory: 512Mi
    cpu: 1
  terraform_state: Dedicated GCS prefix architecture-sandbox/gcp
migration:
  runbook: docs/migration-cloudflare-gcp.md
  legacy_aws: Preserved in terraform/*.tf; no AWS resources changed
  production_acceptance: Real chat/evaluation, JSON round trip, TinyURL, TLS/CORS/SPA verified; see docs/current_phase.yaml for follow-up fixes
